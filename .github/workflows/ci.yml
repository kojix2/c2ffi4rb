name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    name: ${{ matrix.os }} Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-24.04"]
        ruby: ["3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build c2ffi
        run: |
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev libcurl4-gnutls-dev libcairo2-dev
          clang --version
          wget https://github.com/rpav/c2ffi/archive/refs/tags/v18.1.0.0.zip
          unzip v18.1.0.0.zip
          cd c2ffi-18.1.0 && mkdir build && cd build && cmake .. && make -j$(nproc)
      - name: Run tests
        run: bundle exec rake test
        env:
          C2FFI: ${{ github.workspace }}/c2ffi-18.1.0/build/bin/c2ffi
